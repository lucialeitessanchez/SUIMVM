cas:
    hostname: sso.santafe.gob.ar
    url: /service-auth # opcional
    port: 443 # opcional
    service_base_url: http://www.santa.fe.gov.ar  # Url base del sistema que utiliza el bundle
    user: cuil # Si se quiere acceder por cuil sino uid. Por defecto se utiliza cuil
    logout_redirect: app_default  # opcional
    login_failure: app_acceso_denegado # opcional - Debe definirse en el área pública
    debug: true # opcional - Se recomienda false en producción
    version: "3.0" # opcional